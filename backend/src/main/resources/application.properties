spring.application.name=rentaliq-backend
server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/rentaliq}
spring.datasource.username=${DB_USERNAME:rentaliq}
spring.datasource.password=${DB_PASSWORD:rentaliq}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

ml.service.base-url=${ML_SERVICE_URL:http://localhost:8000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.demo.seed=${DEMO_SEED:true}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
