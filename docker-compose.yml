services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rentaliq}
      POSTGRES_USER: ${POSTGRES_USER:-rentaliq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rentaliq}
    ports:
      - "5432:5432"
    volumes:
      - rentaliq_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rentaliq} -d ${POSTGRES_DB:-rentaliq}"]
      interval: 5s
      timeout: 5s
      retries: 20

  ml-service:
    build: ./ml-service
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
    ports:
      - "8000:8000"

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-rentaliq}
      DB_USERNAME: ${POSTGRES_USER:-rentaliq}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-rentaliq}
      ML_SERVICE_URL: http://ml-service:8000
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      DEMO_SEED: "true"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started

volumes:
  rentaliq_postgres:
